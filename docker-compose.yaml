services:
    lite-stream-engine:
        image: alfg/nginx-rtmp
        container_name: litestream_nginx
        # sh wrapper: ensure the notify script is executable before NGINX starts.
        # This is required on Windows where bind-mount files lose the execute bit.
        entrypoint:
            [
                "/bin/sh",
                "-c",
                "chmod +x /usr/local/bin/notify_vod.sh && chmod 777 /tmp/hls && nginx -g 'daemon off;'",
            ]
        ports:
            - "1935:1935"
            - "8080:8080"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - hls_data:/tmp/hls
            # Mount the VOD notifier scripts. Not :ro so the execute bit survives.
            - ./notify_vod.sh:/usr/local/bin/notify_vod.sh
        depends_on:
            localstack:
                condition: service_healthy
            go-backend:
                condition: service_started
        restart: unless-stopped

    postgres:
        image: postgres:15-alpine
        container_name: litestream_db
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped

    redis:
        image: redis:alpine
        container_name: litestream_cache
        ports:
            - "6379:6379"
        restart: unless-stopped

    go-backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: litestream_backend
        env_file:
            - .env
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_started
            redis:
                condition: service_started
            localstack:
                condition: service_healthy
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./infra/template.yaml:/app/template.yaml:ro
        restart: unless-stopped

    localstack:
        image: localstack/localstack:3.4.0
        container_name: litestream_localstack
        ports:
            - "4566:4566"
        environment:
            - SERVICES=s3,sqs
            - DEFAULT_REGION=us-east-1
            - AWS_DEFAULT_REGION=us-east-1
            - DOCKER_HOST=unix:///var/run/docker.sock
        volumes:
            - localstack_data:/var/lib/localstack
            - /var/run/docker.sock:/var/run/docker.sock
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost:4566/_localstack/health",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    go-worker:
        build:
            context: ./worker
            dockerfile: Dockerfile
        container_name: litestream_worker
        env_file:
            - .env
        depends_on:
            localstack:
                condition: service_healthy
        volumes:
            - hls_data:/tmp/hls
        restart: unless-stopped

volumes:
    hls_data:
    postgres_data:
    localstack_data:
