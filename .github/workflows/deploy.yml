name: Deploy to VPS (Self-Hosted)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Production Secrets
        run: |
          echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env

      - name: Deploy with Docker Compose (Production)
        run: |
          docker compose -f docker-compose.prod.yaml down
          docker compose -f docker-compose.prod.yaml up -d --build --remove-orphans
