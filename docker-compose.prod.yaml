services:
    lite-stream-engine:
        image: alfg/nginx-rtmp
        container_name: litestream_nginx
        entrypoint:
            [
                "/bin/sh",
                "-c",
                "chmod +x /usr/local/bin/notify_vod.sh && chmod +x /usr/local/bin/notify_start.sh && chmod 777 /tmp/hls && nginx -g 'daemon off;'",
            ]
        ports:
            - "1935:1935"
            - "8080:8080"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - hls_data:/tmp/hls
            - ./notify_vod.sh:/usr/local/bin/notify_vod.sh
            - ./notify_start.sh:/usr/local/bin/notify_start.sh
        restart: unless-stopped

    postgres:
        image: postgres:15-alpine
        container_name: litestream_db
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped

    redis:
        image: redis:alpine
        container_name: litestream_cache
        ports:
            - "6379:6379"
        restart: unless-stopped

    go-backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: litestream_backend
        env_file:
            - .env
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_started
            redis:
                condition: service_started
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./infra/template.yaml:/app/template.yaml:ro
        restart: unless-stopped

    go-worker:
        build:
            context: ./worker
            dockerfile: Dockerfile
        container_name: litestream_worker
        env_file:
            - .env
        volumes:
            - hls_data:/tmp/hls
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: litestream_frontend
        ports:
            - "80:80"
        depends_on:
            go-backend:
                condition: service_started
            lite-stream-engine:
                condition: service_started
        restart: unless-stopped

volumes:
    hls_data:
    postgres_data:
